server {
    listen 8090;
    server_name localhost;

    location = / {
        return 200 'edge server ready';
        add_header Content-Type text/plain;
    }

    location /hls/ {
        # alias /tmp/edge-hls/;  
        proxy_pass http://media-server:8088/hls/;
        proxy_buffering off;

        # SRS already emits CORS headers when an Origin is present, so strip
        # its versions and add our own to avoid the duplicate
        # `Access-Control-Allow-Origin: *, *` that browsers reject.
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Expose-Headers;
        proxy_hide_header Access-Control-Allow-Credentials;

        add_header Access-Control-Allow-Origin  * always;
        add_header Access-Control-Allow-Headers * always;
        add_header Access-Control-Allow-Methods 'GET, OPTIONS' always;
        add_header Cache-Control no-cache;

        types {
            application/vnd.apple.mpegurl m3u8;
            video/mp2t ts;
        }
    }

}
