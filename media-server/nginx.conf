# This file is not intended to be changed. DO NOT CHANGE
# This is the nginx config file used on the injest media server
#   DO NOT CHANGE:
#       exec command - vital to auto pushing of streams.
#
#
# DO NOT CHANGE
# DO NOT CHANGE
# DO NOT CHANGE
#
env PATH;
user root;
worker_processes 1;

events {
    worker_connections 1024;
}

rtmp {
    server {
        listen 1935;
        chunk_size 4096;

        application live {
    live on;
    record off;
    # Hardcode 'stream' as the name for this to rule out variable issues
    exec /usr/bin/ffmpeg -i rtmp://127.0.0.1/live/$name
            -c copy -f hls
            -hls_time 1 -hls_list_size 3 -hls_flags delete_segments
            /var/www/hls/$name.m3u8;
}

    }
}

http {
    include mime.types;
    default_type application/octet-stream;

    server {
        listen 80;

        location /hls {
                add_header Cache-Control no-cache;

                add_header 'Access-Control-Allow-Origin' '*' always;
                add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range';
            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t ts;
            }

            root /var/www;
        }
    }
}