worker_processes auto;
daemon off;
error_log /dev/stdout info;

events {
    worker_connections 1024;
}

rtmp {
    server {
        listen 1935;
        chunk_size 4096;

        application live {
            live on;
            record off;

            # Validate stream keys against the backend before accepting/dropping.
            # Backend returns 200 to allow, non-2xx to reject.
            on_publish      http://backend:8080/api/internal/rtmp/on_publish;
            on_publish_done http://backend:8080/api/internal/rtmp/on_publish_done;

            hls on;
            hls_path /tmp/hls;
            hls_fragment 3;
            hls_playlist_length 60;
        }
    }
}

http {
    server {
        listen 8088;

        location /hls {
            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t ts;
            }
            root /tmp;
            add_header Cache-Control no-cache;
            add_header Access-Control-Allow-Origin *;
        }
    }
}
