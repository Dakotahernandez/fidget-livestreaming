# SRS 5 configuration tuned for low-latency HLS delivery.
#
# Notes vs the old nginx-rtmp setup:
#   - 0.5s fragments (was 1s) cut steady-state HLS latency in half.
#   - `tcp_nodelay` / `mr off` / `gop_cache off` remove server-side buffering.
#   - HTTP callbacks to the backend use SRS's JSON shape; the backend now
#     accepts either form-encoded (legacy) or JSON (SRS) bodies.
#   - HLS still lives under /tmp/hls so the edge container's read-only mount
#     and existing URL paths (`/hls/<stream-key>/index.m3u8`) keep working.

listen              1935;
max_connections     1000;
daemon              off;
srs_log_tank        console;
srs_log_level       info;
pid                 ./objs/srs.pid;

# Serve HLS over HTTP on the same port the old nginx-rtmp container used,
# so edge nginx and the rest of the stack don't need to change.
http_server {
    enabled         on;
    listen          8088;
    dir             /tmp/hls;
    # CORS so browsers can POST WHEP offers / GET HLS from another origin
    # (the frontend container) without preflight failures.
    crossdomain     on;
}

# SRS HTTP API — also serves the WHEP/WHIP endpoints
# (`/rtc/v1/whep/?app=live&stream=<key>`).
http_api {
    enabled         on;
    listen          1985;
    crossdomain     on;
    raw_api {
        enabled     on;
    }
}

# WebRTC server. WHEP delivery rides over UDP 8000; the candidate IP must
# be reachable from the browser. For local docker we publish 127.0.0.1; in
# production set CANDIDATE to the public host IP via the env var on the
# srs container.
rtc_server {
    enabled         on;
    listen          8000;
    candidate       $CANDIDATE;
    use_auto_detect_network_ip on;
    # Reduce ICE/DTLS handshake delay and disable TCP fallback for speed.
    ecdsa           on;
    encrypt         on;
}

vhost __defaultVhost__ {
    tcp_nodelay     on;
    min_latency     on;

    play {
        gop_cache       off;
        queue_length    10;
        mw_latency      100;
    }

    publish {
        mr off;
    }

    # Bridge incoming RTMP (H.264/AAC from our ffmpeg ingest) to WebRTC
    # for sub-second WHEP playback. SRS handles AAC->Opus internally.
    rtc {
        enabled         on;
        rtmp_to_rtc     on;
        rtc_to_rtmp     off;
        keep_bframe     off;
        nack            on;
        twcc            on;
    }

    http_hooks {
        enabled         on;
        on_publish      http://backend:8080/api/internal/rtmp/on_publish;
        on_unpublish    http://backend:8080/api/internal/rtmp/on_publish_done;
    }

    hls {
        enabled         on;
        hls_fragment    0.5;
        # 5 minutes of DVR window. Setting this to 6s (the previous
        # value) made the player's scrub bar lie: it showed accumulated
        # stream time but seeking backward more than 6s landed on a
        # segment SRS had already deleted, so the player would snap to
        # the live edge / restart at 0. 300s gives Twitch-style
        # "rewind the last few minutes" without unbounded disk growth.
        # Disk math (worst case, all renditions full bitrate):
        #   source ~1500k + 480p 1000k + 360p 600k ≈ 3.1 Mbps
        #   3.1 Mbps × 300 s ≈ 116 MB per active stream
        hls_window      300;
        # Write under /tmp/hls/hls/<stream_key>/ so the HTTP server (rooted at
        # /tmp/hls) exposes them at /hls/<stream_key>/index.m3u8 — the same URL
        # shape the backend's join_stream handler already returns.
        hls_path        /tmp/hls/hls;
        hls_m3u8_file   [stream]/index.m3u8;
        hls_ts_file     [stream]/[seq].ts;
        # Segments older than the playlist window get deleted; segments
        # are also disposed 30s after the publisher disconnects.
        hls_cleanup     on;
        hls_dispose     30;
    }
}
