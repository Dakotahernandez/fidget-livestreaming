name: Basic CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: CI (Rust + Frontend)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Build and test Rust workspace
        run: |
          cargo build --workspace --locked --verbose
          cargo test --workspace --locked --verbose

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  cd:
    name: CD (Deploy to Server)
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare environment file
        run: cp .env.example .env

      - name: Cleanup dangling images only
        # Avoid `docker system prune -a` here: it deletes the warm
        # backend builder cache layer and forces cargo to rebuild ~400
        # crates from scratch on every push, which has been OOM-killing
        # the self-hosted runner mid-compile ("runner lost communication
        # with the server"). Reap only dangling images / build cache
        # older than 7 days instead.
        run: |
          docker image prune -f
          docker builder prune -f --filter "until=168h" || true

      - name: Build services
        env:
          # Cap cargo parallelism on the self-hosted runner so the Rust
          # backend build (~400 crates, peaks ~5 GB RAM at -j$(nproc))
          # doesn't starve the runner agent of memory.
          CARGO_BUILD_JOBS: "2"
        run: |
          DOCKER_BUILDKIT=1 docker compose -f docker-compose.yml build \
            --build-arg CARGO_BUILD_JOBS=2

      - name: Deploy
        if: success()
        run: |
          docker compose -f docker-compose.yml down
          docker compose -f docker-compose.yml up -d
