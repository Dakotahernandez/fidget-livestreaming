networks:
  fidget-net:
    driver: bridge

volumes:
  pg_data:
  hls_segments:

services:
  db:
    image: postgres:16-alpine
    env_file: .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fidget"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./migrations/:/docker-entrypoint-initdb.d/
    ports:
      - "5432:5432"
    networks:
      - fidget-net

  backend:
    build: ./backend
    env_file: .env
    environment:
      # Override RTMP_URL so ffmpeg inside the backend container reaches the
      # media-server via the Docker-internal service name rather than an
      # external domain (which may not be routable from inside the bridge
      # network and would silently drop the ingest, producing no HLS segments).
      RTMP_URL: rtmp://media-server:1935/live
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
      - "4443:4443/udp"
    networks:
      - fidget-net

  frontend:
    build:
      context: ./frontend
      args:
        # Force the streamer onto the WHIP path. Required for deployments
        # behind CloudFront (which can't proxy UDP/4443) and useful for
        # local end-to-end testing of the WHIP+rendition-ladder pipeline.
        VITE_DISABLE_WEBTRANSPORT: "1"
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - fidget-net

  media-server:
    build: ./media-server
    environment:
      # WebRTC ICE candidate that SRS advertises to browsers. For local dev
      # this is the host loopback; override in production with the public
      # host IP so remote viewers can reach UDP 8000.
      CANDIDATE: ${CANDIDATE:-127.0.0.1}
    ports:
      - "1935:1935"
      - "8088:8088"
      # WebRTC media (DTLS/SRTP) for WHEP playback. WHEP signalling
      # (port 1985) is reverse-proxied through the frontend nginx as
      # `/whep/` so it stays same-origin and HTTPS-clean — no need to
      # publish 1985 directly.
      - "8000:8000/udp"
    volumes:
      - hls_segments:/tmp/hls
    depends_on:
      - backend
    networks:
      - fidget-net

  # TURN relay for WHEP viewers behind symmetric NAT / strict corporate
  # firewalls. Disabled by default (run with `--profile turn` to start it)
  # because most local-dev viewers don't need it. In production, enable
  # this and set TURN_URL / TURN_USERNAME / TURN_PASSWORD in .env so the
  # backend's /api/config/rtc endpoint hands the credentials to viewers.
  coturn:
    image: coturn/coturn:latest
    profiles: ["turn"]
    network_mode: host
    command: >
      -n
      --no-cli
      --no-tls
      --no-dtls
      --listening-port=3478
      --realm=${TURN_REALM:-fidget.local}
      --user=${TURN_USERNAME:-fidget}:${TURN_PASSWORD:-changeme}
      --external-ip=${CANDIDATE:-127.0.0.1}
      --min-port=49160
      --max-port=49200

  edge:
    build: ./edge
    ports:
      - "8090:8090"
    volumes:
      - hls_segments:/tmp/hls:ro
    depends_on:
      - media-server
    networks:
      - fidget-net

  router:
    build: ./router
    env_file: .env
    ports:
      - "8070:8070"
    depends_on:
      - backend
    networks:
      - fidget-net
