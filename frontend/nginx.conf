server {
    listen 3000;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to the Rust backend
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Proxy router requests so the watch page can resolve an edge URL
    # without cross-origin browser calls.
    location /router-api/ {
        proxy_pass http://router:8070/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Proxy HLS requests to the media server
    location /hls/ {
        proxy_pass http://media-server:8088;
        proxy_set_header Host $host;
    }
}
