server {
    listen 3000;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # SSE channel for donation alerts. Disable buffering and set a long
    # read timeout so the long-lived EventSource connection survives.
    location /api/alerts/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header X-Accel-Buffering no;
        proxy_read_timeout 3600s;
    }

    # Proxy API requests to the Rust backend
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Donation sound uploads served from the backend's ServeDir mount.
    location /uploads/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }

    # Proxy router requests so the watch page can resolve an edge URL
    # without cross-origin browser calls.
    location /router-api/ {
        proxy_pass http://router:8070/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Proxy HLS requests to the media server
    location /hls/ {
        proxy_pass http://media-server:8088;
        proxy_set_header Host $host;
    }

    # Same-origin WHEP signalling. SRS exposes WHEP under /rtc/v1/whep/
    # on its HTTP API port (1985); proxying it here lets the browser POST
    # the SDP offer without CORS preflights and — critically for prod —
    # without mixed-content errors when the page is served over HTTPS.
    location /whep/ {
        proxy_pass http://media-server:1985/rtc/v1/whep/;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # WHEP SDP exchange is a single small POST; no buffering needed.
        proxy_buffering off;
        proxy_request_buffering off;
        # Allow the SDP body through unmodified.
        client_max_body_size 1m;
    }
}
