<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="spinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C6F135"/>
      <stop offset="100%" stop-color="#39FF14"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g transform="translate(50,50)" filter="url(#glow)">
    <rect x="-6" y="-38" width="12" height="28" rx="6" fill="url(#spinGrad)" transform="rotate(-8)"/>
    <rect x="-6" y="-38" width="12" height="28" rx="6" fill="url(#spinGrad)" opacity="0.78" transform="rotate(112)"/>
    <rect x="-6" y="-38" width="12" height="28" rx="6" fill="url(#spinGrad)" opacity="0.58" transform="rotate(232)"/>
    <circle cx="0" cy="0" r="10" fill="#0d0d0d"/>
    <circle cx="0" cy="0" r="6.5" fill="url(#spinGrad)"/>
    <circle cx="0" cy="0" r="2.5" fill="#0d0d0d"/>
  </g>
</svg>
